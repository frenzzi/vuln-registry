[project]
name = "vuln-registry"
version = "1.0.0"
description = "Система учёта уязвимостей информационных активов (REST API)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/db/seed.py" = ["E501"]
"tests/conftest.py" = ["E402"]
